<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">



<body>
    <main>
        <section class="contact" id="contact">
            <h2 class="heading">Contact Us</h2>
            <form>
                <div class="box">
                    <label for="">full Name <span class="hot">*</span></label>
                    <input type="name" placeholder="Enter Your Name" />
                </div>
                <div class="input-box">
                    <div class="box">
                        <label for="">Email<span class="hot">*</span></label>
                        <input type="email" placeholder="Enter Your Email" />
                    </div>
                    <div class="box">
                        <label for="">Phone</label>
                        <input type="number" placeholder="Enter Number Phone" />
                    </div>
                </div>
                <div class="box">
                    <label for="inquiry">NEEDED SERVICES<span class="required">*</span></label>
                    <select id="services" required>
                        <option value="">Please choose...</option>
                        <option value="">Option1</option>
                        <option value="">Option2</option>
                        <option value="">Option3</option>
                    </select>
                </div>

                <div class="box-area"> <label for="">Message</label>
                    <textarea name="area" placeholder="Your Message here..."></textarea>
                </div>
                <a href="#">
                    <div class="submit">submit<i class="bi bi-arrow-right"></i></div>
                </a>

            </form>
        </section>
    </main>

</body>

</html>
