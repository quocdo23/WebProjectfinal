<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <title>lab4</title>
</head>

<body>
    <main>
        <div class="contact">
            <form>

                <div class="account-form">
                    <h4>Account</h4>
                    <div class="input-box">
                        <i class="bi bi-person-fill"></i>
                        <input type="text" placeholder="Full Name">
                    </div>
                    <div class="input-box">
                        <i class="bi bi-envelope-fill"></i>
                        <input type="email" placeholder="Email Adress">
                    </div>

                    <div class="input-box">
                        <i class="bi bi-key-fill"></i>
                        <input type="password" placeholder="Password">
                    </div>

                </div>
                <div class="center">
                    <div class="date-form">
                        <h4>Date Of Birth</h4>
                        <div class="date-input">
                            <input type="number" placeholder="DD">
                            <input type="number" placeholder="MM">
                            <input type="number" placeholder="YYYY">
                        </div>
                    </div>

                    <div class="gender">
                        <h4>Gender</h4>
                        <div class="btn-gender">
                            <input type="radio" id="button1" name="toggle" checked>
                            <label for="button1">Male</label>

                            <input type="radio" id="button2" name="toggle">
                            <label for="button2">Female</label>
                        </div>
                    </div>
                </div>

                <div class="payment">
                    <h4>Payment Details</h4>
                    <div class="payment-box">
                        <div class="up-box">
                            <div class="box-l">
                                <a href=""><i class="bi bi-credit-card-2-back"></i> Credit Card</a>
                            </div>
                            <div class="box-r">
                                <a href=""><i class="bi bi-paypal"></i> PayPal</a>
                            </div>
                        </div>

                        <div class="input-box">
                            <i class="bi bi-credit-card"></i>
                            <input type="number" placeholder="Card Number">
                        </div>

                        <div class="form-upPay">
                            <div class="input-box-pay">
                                <i class="bi bi-person-fill"></i>
                                <input type="text" placeholder="Card CVC">
                            </div>
                            <div class="upPay_r">
                                <select id="date" name="date-month" required>
                                    <option value="">01 Jan</option>
                                </select>
                                <select id="date" name="year" required>
                                    <option value="">2015</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="form-down">
                        <h4>Terms and Conditions</h4>
                        <div class="check"><input type="checkbox">
                            <h5>You have agreed to the terms and conditions, and confirmed that you
                                have
                                read
                                the
                                privacy policy.</h5>
                        </div>
                    </div>
                </div>


            </form>
        </div>


    </main>

</body>

</html>
